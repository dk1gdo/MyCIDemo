name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      # 1. Клонируем репозиторий
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # нужно, чтобы получить все теги

      # 2. Настраиваем .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3. Восстанавливаем зависимости
      - name: Restore
        run: dotnet restore

      # 4. Строим проект
      - name: Build
        run: dotnet build --no-restore

      # 5. Прогоняем тесты
      - name: Test
        run: dotnet test --no-build

      # 6. Публикуем exe
      - name: Publish exe
        run: dotnet publish DemoCIProject/DemoCIProject.csproj -c Release -r win-x64 --self-contained true -o ./publish
      
      # 7. Автоматически создаём новый тег
      - name: Create tag
        id: tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          # Берём последний тег или v0.0.0, если тегов нет
          LAST_TAG=$(git describe --tags --abbrev=0 || echo "v0.0.0")
          echo "Last tag: $LAST_TAG"
          # Разбираем версию
          IFS='.' read -r MAJOR MINOR PATCH <<< "${LAST_TAG#v}"
          PATCH=$((PATCH + 1))
          NEW_TAG="v$MAJOR.$MINOR.$PATCH"
          echo "New tag: $NEW_TAG"
          git tag $NEW_TAG
          git push origin $NEW_TAG
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      # 8. Создаём GitHub Release с exe
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag.outputs.new_tag }}
          name: Release ${{ steps.tag.outputs.new_tag }}
          files: ./publish/*
