name: Cross-Platform Build & Release with README PR

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (например, 1.12.30)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            rid: win-x64
            ext: .exe
          - os: ubuntu-latest
            rid: linux-x64
            ext: ''
          - os: macos-latest
            rid: osx-x64
            ext: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build

      - name: Publish
        run: dotnet publish DemoCIProject/DemoCIProject.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DemoCIProject-${{ matrix.rid }}
          path: ./publish/*

  release:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Определяем тег
      - name: Determine tag
        id: tag
        shell: pwsh
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if ($env:VERSION_INPUT -ne '') {
              $NEW_TAG = "v$env:VERSION_INPUT"
          } else {
              $LAST_TAG = git describe --tags --abbrev=0
              if (-not $LAST_TAG) { $LAST_TAG = "v0.0.0" }
              if ($LAST_TAG -match "v(\d+)\.(\d+)\.(\d+)") {
                  $MAJOR = [int]$Matches[1]
                  $MINOR = [int]$Matches[2]
                  $PATCH = [int]$Matches[3] + 1
              } else {
                  $MAJOR = 0
                  $MINOR = 0
                  $PATCH = 1
              }
              $NEW_TAG = "v$MAJOR.$MINOR.$PATCH"
          }

          git tag $NEW_TAG
          git push origin $NEW_TAG
          Write-Host "new_tag=$NEW_TAG"
          echo "new_tag=$NEW_TAG" >> $env:GITHUB_OUTPUT

      # Скачиваем артефакты
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: DemoCIProject-win-x64
          path: ./publish/win

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: DemoCIProject-linux-x64
          path: ./publish/linux

      - name: Download Mac artifact
        uses: actions/download-artifact@v4
        with:
          name: DemoCIProject-osx-x64
          path: ./publish/mac

      # Создаём Release с бинарниками всех платформ
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag.outputs.new_tag }}
          name: Release ${{ steps.tag.outputs.new_tag }}
          files: |
            ./publish/win/*
            ./publish/linux/*
            ./publish/mac/*

      # Обновляем README через Pull Request
      - name: Create README update branch
        id: readme-branch
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.new_tag }}"
          $branch = "update-readme/$tag"
          git checkout -b $branch

          $repo = "${{ github.repository }}"
          $readme = "README.md"

          $winLink = "[Windows](https://github.com/$repo/releases/download/$tag/DemoCIProject.exe)"
          $linuxLink = "[Linux](https://github.com/$repo/releases/download/$tag/DemoCIProject)"
          $macLink = "[Mac](https://github.com/$repo/releases/download/$tag/DemoCIProject)"
          $newLinks = "### Скачать последнюю версию`n$winLink | $linuxLink | $macLink`n"

          if (-Not (Test-Path $readme)) {
              New-Item -Path $readme -ItemType File -Value $newLinks
          } else {
              $content = Get-Content $readme
              if ($content -notmatch "DemoCIProject") {
                  Add-Content -Path $readme -Value $newLinks
              } else {
                  $pattern = '(https://github\.com/.*/releases/download/.*DemoCIProject(\.exe)?)'
                  ($content -replace $pattern, "$winLink | $linuxLink | $macLink") | Set-Content $readme
              }
          }

          git add $readme
          git commit -m "Update download links to $tag" || Write-Host "No changes to commit"
          echo "branch_name=$branch" >> $env:GITHUB_OUTPUT

      - name: Push README branch
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.readme-branch.outputs.branch_name }}

      - name: Create Pull Request for README
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update download links to ${{ steps.tag.outputs.new_tag }}"
          branch: update-readme/${{ steps.tag.outputs.new_tag }}   # новая ветка для PR
          title: "Update download links to ${{ steps.tag.outputs.new_tag }}"
          body: "Автоматическое обновление ссылок на последнюю версию DemoCIProject"
          base: main
          labels: "auto-update"
