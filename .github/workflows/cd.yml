name: Cross-Platform Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (например, 1.12.30)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            rid: win-x64
            ext: .exe
          - os: ubuntu-latest
            rid: linux-x64
            ext: ''
          - os: macos-latest
            rid: osx-x64
            ext: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build

      - name: Publish
        run: dotnet publish DemoCIProject/DemoCIProject.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: DemoCIProject-${{ matrix.rid }}
          path: ./publish/*

  release:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Определяем тег
      - name: Determine tag
        id: tag
        shell: pwsh
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if (${{ github.event.inputs.version }} -ne '') {
              $NEW_TAG = "v${{ github.event.inputs.version }}"
          } else {
              $LAST_TAG = git describe --tags --abbrev=0
              if (-not $LAST_TAG) { $LAST_TAG = "v0.0.0" }
              if ($LAST_TAG -match "v(\d+)\.(\d+)\.(\d+)") {
                  $MAJOR = [int]$Matches[1]
                  $MINOR = [int]$Matches[2]
                  $PATCH = [int]$Matches[3] + 1
              } else {
                  $MAJOR = 0
                  $MINOR = 0
                  $PATCH = 1
              }
              $NEW_TAG = "v$MAJOR.$MINOR.$PATCH"
          }

          git tag $NEW_TAG
          git push origin $NEW_TAG
          Write-Host "new_tag=$NEW_TAG"
          echo "new_tag=$NEW_TAG" >> $env:GITHUB_OUTPUT

      # Скачиваем артефакты с билдов для всех платформ
      - name: Download Windows artifact
        uses: actions/download-artifact@v3
        with:
          name: DemoCIProject-win-x64
          path: ./publish/win

      - name: Download Linux artifact
        uses: actions/download-artifact@v3
        with:
          name: DemoCIProject-linux-x64
          path: ./publish/linux

      - name: Download Mac artifact
        uses: actions/download-artifact@v3
        with:
          name: DemoCIProject-osx-x64
          path: ./publish/mac

      # Создаём Release с бинарниками всех платформ
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag.outputs.new_tag }}
          name: Release ${{ steps.tag.outputs.new_tag }}
          files: |
            ./publish/win/*
            ./publish/linux/*
            ./publish/mac/*

      # Обновляем README.md с ссылками на все платформы
      - name: Update README
        shell: pwsh
        run: |
          $repo = "${{ github.repository }}"
          $tag = "${{ steps.tag.outputs.new_tag }}"
          $readme = "README.md"
      
          $winLink = "[Windows](https://github.com/$repo/releases/download/$tag/DemoCIProject.exe)"
          $linuxLink = "[Linux](https://github.com/$repo/releases/download/$tag/DemoCIProject)"
          $macLink = "[Mac](https://github.com/$repo/releases/download/$tag/DemoCIProject)"
          $newLinks = "### Скачать последнюю версию`n$winLink | $linuxLink | $macLink`n"
      
          $content = Get-Content $readme
      
          if ($content -notmatch "DemoCIProject") {
          # Если ссылок ещё нет, добавляем в конец README
          Add-Content -Path $readme -Value $newLinks
          } else {
            # Если ссылки есть, заменяем их
            $pattern = '(https://github\.com/.*/releases/download/.*DemoCIProject(\.exe)?)'
            ($content -replace $pattern, "$winLink | $linuxLink | $macLink") | Set-Content $readme
          }
      
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add $readme
          git commit -m "Update download links to $tag" || Write-Host "No changes to commit"
          git push
